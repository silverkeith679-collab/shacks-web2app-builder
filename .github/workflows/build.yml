# Shacks Web2App cloud build. Lives in the build repo at .github/workflows/build.yml
name: Shacks Web2App build
run-name: Build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id
        required: true
        type: string
      token:
        description: Per-job callback token
        required: true
        type: string
      base_url:
        description: Base URL of the site
        required: true
        type: string
      do_android:
        description: Build Android
        required: true
        default: 'true'
        type: string
      do_ios:
        description: Build iOS
        required: true
        default: 'false'
        type: string
      android_tasks:
        description: Gradle tasks
        required: true
        default: 'assembleRelease bundleRelease'
        type: string

jobs:
  android:
    if: ${{ inputs.do_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      TOKEN: ${{ inputs.token }}
      BASE_URL: ${{ inputs.base_url }}
      TASKS: ${{ inputs.android_tasks }}
      CALLBACK: ${{ inputs.base_url }}/api/callback.php
    steps:
      - name: Mask token
        run: echo "::add-mask::$TOKEN"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Report start
        run: |
          curl -sS -X POST "$CALLBACK" -F job_id="$JOB_ID" -F token="$TOKEN" \
            -F platform=android -F status=running -F "message=Compiling the Android app..." || true

      - name: Download project
        run: |
          mkdir proj
          curl -fsSL -o android.zip "$BASE_URL/api/download.php?job=$JOB_ID&file=android_src" 2>&1 | tee proj/build.log
          unzip -q android.zip -d proj

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_S: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          KS="$RUNNER_TEMP/sign/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            ALIAS="$KEY_ALIAS_S"; SP="$KS_PASS_S"; KP="${KEY_PASS_S:-$KS_PASS_S}"; NEW=false
          else
            SP=$(openssl rand -hex 12); KP="$SP"; ALIAS=app; NEW=true
            keytool -genkeypair -keystore "$KS" -storepass "$SP" -keypass "$KP" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Shacks Web2App, O=Shacks Tech, C=UG"
            printf 'Keystore: release.jks\nAlias: %s\nStore password: %s\nKey password: %s\n' "$ALIAS" "$SP" "$KP" > "$RUNNER_TEMP/sign/credentials.txt"
          fi
          echo "::add-mask::$SP"
          echo "::add-mask::$KP"
          {
            echo "KS_FILE=$KS"
            echo "KS_PASS=$SP"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASS=$KP"
            echo "KS_NEW=$NEW"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: proj
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace $TASKS \
            -PKS_FILE="$KS_FILE" -PKS_PASS="$KS_PASS" -PKEY_ALIAS="$KEY_ALIAS" -PKEY_PASS="$KEY_PASS" 2>&1 | tee build.log

      - name: Upload results
        run: |
          ARGS=(-F job_id="$JOB_ID" -F token="$TOKEN" -F platform=android -F status=success -F "message=Android build finished.")
          APK=$(find proj/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)
          AAB=$(find proj/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then ARGS+=(-F "apk=@$APK"); fi
          if [ -n "$AAB" ]; then ARGS+=(-F "aab=@$AAB"); fi
          if [ "$KS_NEW" = "true" ]; then
            (cd "$RUNNER_TEMP/sign" && zip -q signing.zip release.jks credentials.txt)
            ARGS+=(-F "signing=@$RUNNER_TEMP/sign/signing.zip")
          fi
          HTTP=$(curl -sS --retry 3 -o resp.txt -w '%{http_code}' -X POST "$CALLBACK" "${ARGS[@]}")
          if [ "$HTTP" != "200" ]; then
            echo "UPLOAD FAILED HTTP $HTTP: $(head -c 300 resp.txt)" | tee -a proj/build.log
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: |
          LOG=""
          if [ -f proj/build.log ]; then
            LOG=$(grep -E "error:|FAILED|What went wrong|Execution failed|Could not|UPLOAD FAILED|curl:" proj/build.log | tail -40 | cut -c1-300 || true)
            [ -n "$LOG" ] || LOG=$(tail -30 proj/build.log | cut -c1-300)
          fi
          curl -sS -X POST "$CALLBACK" -F job_id="$JOB_ID" -F token="$TOKEN" \
            -F platform=android -F status=failed --form-string "message=Build failed." --form-string "log=$LOG" || true

  ios:
    if: ${{ inputs.do_ios == 'true' }}
    runs-on: macos-14
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      TOKEN: ${{ inputs.token }}
      BASE_URL: ${{ inputs.base_url }}
      CALLBACK: ${{ inputs.base_url }}/api/callback.php
    steps:
      - name: Mask token
        run: echo "::add-mask::$TOKEN"

      - name: Report start
        run: |
          curl -sS -X POST "$CALLBACK" -F job_id="$JOB_ID" -F token="$TOKEN" \
            -F platform=ios -F status=running -F "message=Compiling the iOS app..." || true

      - name: Download project
        run: |
          mkdir proj
          curl -fsSL -o ios.zip "$BASE_URL/api/download.php?job=$JOB_ID&file=ios_src" 2>&1 | tee proj/build.log
          unzip -q ios.zip -d proj

      - name: Generate Xcode project
        working-directory: proj
        run: |
          set -o pipefail
          brew install xcodegen 2>&1 | tail -3
          xcodegen generate 2>&1 | tee -a build.log

      - name: Archive (unsigned)
        working-directory: proj
        run: |
          set -o pipefail
          xcodebuild -version | tee -a build.log
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee -a build.log | tail -n 30
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry app.ipa Payload

      - name: Upload results
        run: |
          HTTP=$(curl -sS --retry 3 -o resp.txt -w '%{http_code}' -X POST "$CALLBACK" -F job_id="$JOB_ID" -F token="$TOKEN" \
            -F platform=ios -F status=success -F "message=Unsigned IPA ready. Sign it with your Apple certificate to install or publish." \
            -F "ipa=@proj/app.ipa")
          if [ "$HTTP" != "200" ]; then
            echo "UPLOAD FAILED HTTP $HTTP: $(head -c 300 resp.txt)" | tee -a proj/build.log
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: |
          LOG=""
          if [ -f proj/build.log ]; then
            LOG=$(grep -E "error:|error •|ARCHIVE FAILED|Command .* failed|UPLOAD FAILED|curl:|Error:" proj/build.log | tail -40 | cut -c1-300 || true)
            [ -n "$LOG" ] || LOG=$(tail -30 proj/build.log | cut -c1-300)
          fi
          curl -sS -X POST "$CALLBACK" -F job_id="$JOB_ID" -F token="$TOKEN" \
            -F platform=ios -F status=failed --form-string "message=Build failed." --form-string "log=$LOG" || true
